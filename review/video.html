<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Video Review | Film Stop</title><link rel="stylesheet" href="/review/review.css?v=4"></head><body><header><a href="/" aria-label="Film Stop home"><img src="/assets/images/filmstop-logo-white.png" alt="Film Stop"></a><span>Video review</span></header><main>
<section id="access" class="panel narrow"><p class="eyebrow">Private screening</p><h1>Your film. Your feedback.</h1><p>Enter the passcode shared by Film Stop to watch and leave editing notes.</p><form id="unlock"><label>Review passcode<input name="passcode" type="password" required autocomplete="current-password"></label><button>Open video review</button></form></section>
<section id="video-review" hidden><p id="client-name" class="eyebrow"></p><h1 id="video-title"></h1><div class="review-layout"><div><div class="video-shell" id="video-shell"><video id="player" controls playsinline preload="metadata" controlslist="nodownload noremoteplayback" disablepictureinpicture disableremoteplayback></video><img class="playback-logo" src="/assets/images/filmstop-logo-white.png" alt=""></div><div class="video-toolbar"><button id="add-note">Comment at current time</button><span id="playback-time">00:00</span></div><form id="note-form" class="panel"><h2>Leave an editing note</h2><div class="actions"><label>Your name<input name="author" required maxlength="100" autocomplete="name"></label><label>Timestamp<input name="time" required value="00:00" placeholder="mm:ss" inputmode="decimal"></label></div><label>What would you like changed?<textarea name="text" required maxlength="4000" rows="4" placeholder="Describe the change for this moment…"></textarea></label><button id="post-note">Post comment</button><p>Each comment is saved to Film Stop as soon as you post it.</p></form></div><aside><div class="actions"><h2>Editing notes</h2><button id="refresh-notes" class="secondary">Refresh</button></div><button id="export-notes" class="secondary" hidden>Download feedback list</button><p id="note-count"></p><div id="notes"></div></aside></div></section><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="/review/video.js?v=4"></script></body></html>
