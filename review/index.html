<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Photo Review | Film Stop</title><link rel="stylesheet" href="/review/review.css?v=1"></head>
<body><header><a href="/" aria-label="Film Stop home"><img src="/assets/images/filmstop-logo-white.png" alt="Film Stop"></a><span>Photo review</span></header><main>
<section id="access" class="panel narrow"><p class="eyebrow">Your gallery</p><h1>Choose your favorites.</h1><p>Enter the passcode Film Stop shared with you to review your photos.</p><form id="unlock"><label>Gallery passcode<input name="passcode" type="password" required autocomplete="current-password"></label><button>Open gallery</button></form></section>
<section id="gallery" hidden><div class="intro"><div><p class="eyebrow">Film Stop · Photo review</p><h1 id="title"></h1><p id="instructions"></p></div><label class="filter"><input id="selected-only" type="checkbox"> Show selected only</label></div><p id="submitted" class="notice" hidden></p><div id="photos" class="grid"></div><div class="selection-bar"><strong id="count" aria-live="polite"></strong><button id="submit">Review & submit</button></div></section>
<p id="status" role="status" aria-live="polite"></p></main>
<dialog id="viewer"><button id="close-viewer" class="secondary close" aria-label="Close photo">Close</button><div class="viewer-image"><button id="prev" class="secondary" aria-label="Previous photo">←</button><img id="large" alt=""><button id="next" class="secondary" aria-label="Next photo">→</button></div><p id="filename"></p><button id="toggle-pick">Select photo</button><p id="viewer-count" aria-live="polite"></p></dialog>
<dialog id="confirm"><h2>Submit your selections?</h2><p id="confirm-text"></p><p>Your choices will be sent to Film Stop for editing. Contact Film Stop if you need to change them afterward.</p><div class="actions"><button id="cancel-submit" class="secondary">Keep reviewing</button><button id="confirm-submit">Submit selections</button></div></dialog>
<script type="module" src="/review/client.js?v=1"></script></body></html>
