    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Film Stop</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
        }
        .logo {
            width: 120px;
            margin-bottom: 2rem;
            filter: invert(1);
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ff4d00;
        }
        p {
            font-size: 1.125rem;
            color: #999;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: #ff4d00;
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #ff6b2b;
        }
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }
        .checkmark svg {
            width: 40px;
            height: 40px;
            stroke: white;
        }
        .promo-banner {
            margin: 0 auto 2rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(255, 77, 0, 0.2), rgba(17, 17, 17, 0.9));
        }
        .promo-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.75rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .promo-price {
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        .promo-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .announcement-section {
            margin: 1.5rem 0 2rem;
            padding: 0.75rem 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.75rem;
            color: #999999;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/images/logo.png" alt="Film Stop" class="logo">
        <div class="promo-actions" style="margin-bottom: 1.5rem;">
            <a href="https://calendar.app.google/SfpoyramqV5vaUvP6" class="btn" target="_blank" rel="noopener noreferrer">Book a Strategy Call</a>
        </div>
        <div class="promo-banner">
            <div class="promo-title">Get a Quote (Limited Slots)</div>
            <div class="promo-price">For first-time clients only. Best for small brands testing conversion video.</div>
            <div class="promo-actions">
                <a href="/quote.html" class="btn">Get a Quote</a>
            </div>
        </div>
        <div class="checkmark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1>Message Sent!</h1>
        <div class="announcement-section"></div>
        <p>Thank you for reaching out! We've received your message and will get back to you within 24-48 hours.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
